<div class="system-tools-page" id="view-system-tools" data-display="grid" style="display: none;">
  <section class="system-tools-hero">
    <div class="system-tools-hero-icon"><i class="fa-solid fa-screwdriver-wrench" aria-hidden="true"></i></div>
    <div>
      <h2 class="card-title">Công cụ hệ thống</h2>
      <p>Quản lý công cụ KAI. Bật/tắt áp dụng cho yêu cầu mới trên toàn hệ thống.</p>
    </div>
  </section>

  <section class="system-tools-catalog">
    <div class="system-tools-toolbar">
      <label class="system-tools-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="system-tools-search" type="search" aria-label="Tìm công cụ" placeholder="Tìm công cụ..." oninput="renderSystemTools()">
      </label>
      <select id="system-tools-filters" class="system-tools-group-select" aria-label="Lọc theo nhóm công cụ" onchange="setSystemToolGroup(this.value)"><option value="all">Tất cả nhóm</option></select>
      <div class="system-tools-catalog-counts" aria-live="polite"><span>Hiển thị <strong id="system-tools-matched">0</strong>/<strong id="system-tools-total">0</strong> công cụ</span><span><strong id="system-tools-available">0</strong> đang bật</span><span><strong id="system-tools-groups">0</strong> nhóm</span></div>
      <button class="btn-secondary-sm" type="button" onclick="fetchSystemTools(true)"><i class="fa-solid fa-rotate"></i> Tải lại</button>
    </div>
    <div class="system-tools-grid" id="system-tools-grid">
      <div class="system-tools-loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải danh sách tool...</div>
    </div>
  </section>
</div>
