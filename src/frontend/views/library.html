<div class="system-tools-page workspace-page library-page" data-display="grid" style="display:none;" id="view-library">
  <section class="system-tools-hero workspace-hero library-topbar">
    <div class="system-tools-hero-icon library-hero-icon"><i class="fa-solid fa-folder-open"></i></div>
    <div><div class="card-title"><i class="fa-solid fa-folder-open"></i> Thư viện tri thức</div><p>Upload, đọc nội dung, chia đoạn và lập chỉ mục tài liệu cho RAG.</p></div>
    <div class="library-top-actions"><button class="btn-primary" onclick="openUploadLibraryModal()"><i class="fa-solid fa-plus"></i> Thêm tài liệu</button></div>
  </section>
  <section class="system-tools-card library-content-card">
  <div class="library-tabs"><button class="active" onclick="filterLibraryCategory('all',this)"><i class="fa-solid fa-border-all"></i> Tất cả</button><button onclick="filterLibraryCategory('PDF',this)">PDF</button><button onclick="filterLibraryCategory('DOCX',this)">Word</button><button onclick="filterLibraryCategory('XLSX',this)">Excel</button><button onclick="filterLibraryCategory('TXT',this)">Văn bản</button><div class="library-tab-actions"><button class="btn-secondary-sm" onclick="toggleLibraryView()" title="Đổi kiểu hiển thị" aria-label="Đổi kiểu hiển thị"><i id="library-view-icon" class="fa-solid fa-grip"></i></button><button class="btn-secondary-sm" onclick="fetchLibraryDocuments()" title="Làm mới tài liệu" aria-label="Làm mới tài liệu"><i class="fa-solid fa-rotate"></i></button></div></div>
  <div class="library-controls"><div class="library-search"><i class="fa-solid fa-magnifying-glass"></i><input id="lib-search-input" placeholder="Tìm tài liệu..." oninput="filterLibraryDocs()"></div><select id="library-sort" onchange="renderLibraryDocuments()"><option value="newest">Mới nhất</option><option value="name">Theo tên</option><option value="size">Dung lượng</option></select><span id="lib-docs-counter">0 tài liệu</span></div>
  <div class="library-summary"><span><strong id="lib-stat-docs">0</strong> tài liệu</span><span><strong id="lib-stat-chunks">0</strong> chunks</span><span><strong id="lib-stat-size">0 B</strong> dữ liệu</span><span id="lib-stat-status">Sẵn sàng</span></div>
  <div id="library-docs-grid" class="library-docs-grid"><div class="library-empty"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải...</div></div>
  <div id="library-pagination" class="pagination-wrapper"></div>
  </section>
</div>

<div class="modal-backdrop" id="library-upload-modal" onclick="handleLibraryModalBackdrop(event)"><div class="copilot-modal-dialog library-modal-dialog"><div class="copilot-modal-header"><div class="copilot-modal-title"><i class="fa-solid fa-cloud-arrow-up"></i> Thêm tài liệu</div><button class="modal-close-btn" onclick="closeLibraryModal()"><i class="fa-solid fa-xmark"></i></button></div><form id="library-upload-form" class="library-upload-form" onsubmit="submitLibraryDocument(event)"><label class="library-drop-zone" id="library-drop-zone" for="library-file-input"><i class="fa-solid fa-cloud-arrow-up"></i><strong>Chọn file để tải lên</strong><span>PDF, DOCX, XLSX, XLS, CSV, SQL, TXT, Markdown · tối đa 20 MB</span><input id="library-file-input" type="file" accept=".pdf,.docx,.xlsx,.xls,.csv,.sql,.txt,.md" required onchange="handleLibraryFileSelection(event)"></label><div class="library-form-grid"><div class="library-form-field library-form-field-wide"><label class="form-label">Tên tài liệu</label><input class="form-control" id="library-title-input" required></div><div class="library-form-field"><label class="form-label">Định dạng</label><input class="form-control" id="library-type-input" readonly></div><div class="library-form-field"><label class="form-label">Dung lượng</label><input class="form-control" id="library-size-input" readonly></div><div class="library-form-field library-form-field-wide"><label class="form-label">Phân loại</label><select class="form-control" id="library-category-input"><option>Tài liệu Nghiệp vụ</option><option>Quy trình Nghiệp vụ</option><option>Chính sách Doanh nghiệp</option><option>Báo cáo Tài chính</option><option>SQL Schema DDL</option></select></div></div><div class="library-upload-note"><i class="fa-solid fa-circle-info"></i> File sẽ được đọc, chia đoạn và lập chỉ mục tự động. PDF scan cần OCR nên có thể báo chưa đọc được.</div><div class="library-modal-actions"><button type="button" class="btn-secondary-sm" onclick="closeLibraryModal()">Hủy</button><button type="submit" class="btn-primary" id="library-submit-btn"><i class="fa-solid fa-wand-magic-sparkles"></i> Tải lên & xử lý</button></div></form></div></div>

<div class="modal-backdrop" id="library-preview-modal" onclick="handleLibraryPreviewBackdrop(event)"><div class="copilot-modal-dialog library-preview-dialog"><div class="copilot-modal-header"><div><div class="copilot-modal-title" id="library-preview-title">Xem tài liệu</div><small id="library-preview-meta"></small></div><div class="library-preview-actions"><a id="library-open-original" class="btn-secondary-sm" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square"></i> File gốc</a><button class="modal-close-btn" onclick="closeLibraryPreview()"><i class="fa-solid fa-xmark"></i></button></div></div><div id="library-preview-content" class="library-preview-content"></div></div></div>
