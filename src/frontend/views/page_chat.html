<!-- PAGE VIEW: Dedicated AI Chat & Text-to-SQL Playground Page View -->
<div class="content-card" id="view-page_chat" style="display: none; grid-column: span 2; padding: 0; background: transparent; border: none; box-shadow: none;">
  <div class="chat-page-layout chat-workspace"
    style="display: flex; gap: 6px; height: calc(100vh - 150px); font-family: 'Inter', sans-serif;">

    <!-- LEFT PANEL: SESSIONS SIDEBAR -->
    <div class="chat-sidebar"
      style="width: 290px; min-width: 290px; background: #ffffff; border: 1px solid var(--border-color); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.03);">
      <button class="chat-sessions-toggle" type="button" aria-expanded="false" aria-controls="chat-sessions-list"
        onclick="const expanded = this.parentElement.classList.toggle('sessions-open'); this.setAttribute('aria-expanded', String(expanded));">
        <i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i> Cuộc trò chuyện
        <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
      </button>

      <!-- Sidebar Header & New Chat Button -->
      <div class="chat-sidebar-new" style="padding: 16px; border-bottom: 1px solid var(--border-color); background: #f8fafc;">
        <div class="chat-history-heading"><strong>Lịch sử hội thoại</strong>
          <button type="button" class="chat-new-session-btn" onclick="createNewChatSession()" title="Cuộc trò chuyện mới" aria-label="Cuộc trò chuyện mới"><i class="fa-regular fa-pen-to-square" aria-hidden="true"></i></button>
        </div>
        <label class="chat-history-search">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input id="chat-history-search" type="search" placeholder="Tìm kiếm cuộc trò chuyện…" aria-label="Tìm kiếm cuộc trò chuyện" oninput="renderChatSessionsList()" autocomplete="off">
        </label>
      </div>

      <!-- Sessions List -->
      <div id="chat-history-save-notice" class="chat-history-save-notice" role="status" hidden>
        <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
        <span id="chat-history-save-message"></span>
        <button id="chat-history-save-retry" type="button" onclick="retrySaveChatSessions()"><i class="fa-solid fa-rotate-right" aria-hidden="true"></i> Thử lưu lại</button>
      </div>
      <div style="flex: 1; overflow-y: auto; padding: 12px;" id="chat-sessions-list">
        <!-- Dynamically populated via JS -->
      </div>

      <!-- Clear All Conversations Footer -->
      <div class="chat-sidebar-footer" style="padding: 12px 16px; border-top: 1px solid var(--border-color); background: #f8fafc;">
        <button class="chat-clear-sessions-btn" onclick="clearAllChatSessions()"
          style="width: 100%; background: #ffffff; border: 1px solid #e2e8f0; color: #b91c1c; font-size: 12px; font-weight: 600; padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;">
          <i class="fa-solid fa-trash-can"></i> Xóa tất cả các cuộc trò chuyện
        </button>
      </div>
    </div>

    <!-- RIGHT PANEL: MAIN CHAT PLAYGROUND -->
    <div class="chat-main"
      style="flex: 1; min-width: 0; background: transparent; border: 1px solid var(--border-color); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.03);">

      <!-- Messages Container -->
      <div id="page-chat-messages-container"
        style="flex: 1; overflow-y: auto;">
        <div id="page-chat-thread" class="chat-thread"></div>
        <p class="page-chat-disclaimer">KAI có thể mắc lỗi. Hãy kiểm tra thông tin quan trọng.</p>
      </div>

      <section class="chat-welcome" aria-labelledby="chat-welcome-title">
        <div class="chat-welcome-content">
          <div class="chat-welcome-brand" aria-hidden="true"><i class="fa-solid fa-wand-magic-sparkles"></i><span>KAI</span></div>
          <h2 id="chat-welcome-title">Bạn muốn khám phá dữ liệu gì hôm nay?</h2>
          <p>Đặt câu hỏi bằng ngôn ngữ tự nhiên để khám phá dữ liệu, viết SQL hoặc tạo biểu đồ.</p>
          <div class="chat-welcome-suggestions">
            <button type="button" onclick="useQuickPrompt('Liệt kê các bảng dữ liệu hiện có và mô tả ngắn nội dung của từng bảng.')">
              <i class="fa-solid fa-database" aria-hidden="true"></i><span><strong>Khám phá bảng dữ liệu</strong><small>Tìm hiểu dữ liệu đang có</small></span><i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
            </button>
            <button type="button" onclick="useQuickPrompt('Phân tích doanh thu theo tháng từ dữ liệu hiện có và vẽ biểu đồ xu hướng. Nếu thiếu thông tin, hãy hỏi tôi trước.')">
              <i class="fa-solid fa-chart-column" aria-hidden="true"></i><span><strong>Phân tích doanh thu</strong><small>Nhìn rõ xu hướng qua biểu đồ</small></span><i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
            </button>
            <button type="button" onclick="useQuickPrompt('Tôi muốn tính tổng, giá trị nhỏ nhất, lớn nhất và trung bình. Hãy giúp tôi chọn bảng và cột phù hợp từ dữ liệu hiện có.')">
              <i class="fa-solid fa-calculator" aria-hidden="true"></i><span><strong>Tính toán thống kê</strong><small>Tổng hợp các con số cần quan tâm</small></span><i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
            </button>
            <button type="button" onclick="useQuickPrompt('Giúp tôi viết truy vấn SQL từ dữ liệu hiện có. Hãy hỏi tôi muốn lấy thông tin gì và giải thích truy vấn đề xuất.')">
              <i class="fa-solid fa-code" aria-hidden="true"></i><span><strong>Viết truy vấn SQL</strong><small>Biến câu hỏi thành truy vấn</small></span><i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
            </button>
          </div>
          <small class="chat-welcome-hint">Chọn một gợi ý để chỉnh sửa, hoặc nhập câu hỏi của bạn bên dưới.</small>
        </div>
      </section>

      <!-- Bottom Input Box -->
      <div class="page-chat-composer-area" style="padding: 12px 22px 18px 22px;">
        <!-- Model suggestions appear only for the latest assistant reply. -->
        <div id="quick-prompts-bar" role="group" aria-label="Gợi ý trả lời" hidden></div>
        <div class="chat-input-wrapper page-chat-composer">
          <div class="page-chat-input-line">
          <button id="page-chat-web-inline" class="page-chat-web-inline" type="button" hidden onclick="togglePageChatWebSearch(event)" title="Tắt tìm kiếm web" aria-label="Tìm kiếm trên mạng đang bật. Nhấn để tắt."><i class="fa-solid fa-globe" aria-hidden="true"></i><span>Tìm kiếm trên mạng</span></button>
          <textarea id="page-chat-user-input" rows="1" aria-label="Nhập yêu cầu cho KAI"
            placeholder="Hỏi KAI…"
            maxlength="4000" oninput="updatePageChatCharacterCount(this.value); resizeChatComposerInput(this)"
            onkeydown="handlePageChatKeyPress(event)"></textarea>
          </div>
          <div id="page-chat-attachment-preview" class="page-chat-attachment-preview"></div>
          <div class="page-chat-add-wrap">
            <button id="page-chat-add-trigger" class="page-chat-tools-trigger" type="button" onclick="toggleChatAddMenu(event)"
              title="Thêm nguồn và công cụ" aria-label="Thêm nguồn và công cụ" aria-haspopup="menu" aria-controls="page-chat-add-menu" aria-expanded="false">
              <i class="fa-solid fa-plus" aria-hidden="true"></i>
            </button>
            <div id="page-chat-add-menu" class="page-chat-add-menu" role="menu">
              <button id="page-chat-knowledge-toggle" type="button" role="menuitem" onclick="closePageChatMenus(); toggleChatKnowledgePanel(event)" aria-expanded="false"><i class="fa-solid fa-database" aria-hidden="true"></i><span>Chọn nguồn tri thức</span></button>
              <button id="page-chat-web-toggle" type="button" role="menuitemcheckbox" onclick="togglePageChatWebSearch(event); closePageChatMenus()" aria-checked="false" aria-pressed="false"><i class="fa-solid fa-globe" aria-hidden="true"></i><span>Tìm kiếm web</span></button>
              <button type="button" role="menuitem" onclick="openChatFilePicker()" title="Tải tài liệu hoặc ảnh, tối đa 5 tệp"><i class="fa-solid fa-paperclip" aria-hidden="true"></i><span>Đính kèm tệp</span><small>Tài liệu, ảnh</small></button>
            </div>
            <div id="page-chat-knowledge-panel" class="page-chat-knowledge-panel page-chat-inline-panel" hidden onclick="event.stopPropagation()">
              <div class="page-chat-knowledge-search"><i class="fa-solid fa-magnifying-glass"></i><input id="page-chat-knowledge-search" placeholder="Tìm tài liệu..." oninput="renderChatKnowledgeOptions()"></div>
              <div id="page-chat-knowledge-options" class="page-chat-knowledge-options"></div>
            </div>
            <input id="page-chat-file-input" type="file" multiple hidden onchange="handlePageChatFiles(event)">
            <input id="page-chat-camera-input" type="file" accept="image/*" capture="environment" hidden onchange="handlePageChatFiles(event)">
            <select id="page-chat-knowledge-source" multiple hidden><option value="auto" selected>Tự động</option><option value="none">Không dùng</option></select>
          </div>
          <div id="page-chat-knowledge-inline" class="page-chat-knowledge-inline"></div>
          <div class="page-chat-composer-actions">
            <span id="page-chat-character-count" class="page-chat-character-count" hidden>0/4000</span>
            <div class="page-chat-model-picker">
              <button id="page-chat-model-trigger" class="page-chat-model-trigger" type="button"
                onclick="toggleChatModelMenu(event)" aria-label="Chọn mô hình và mức độ" aria-haspopup="dialog" aria-controls="page-chat-model-menu" aria-expanded="false">
                <span id="page-chat-model-label">Đang tải...</span>
                <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
              </button>
              <div id="page-chat-model-menu" class="page-chat-model-menu" role="listbox"></div>
              <select id="page-chat-model-selector" aria-hidden="true" tabindex="-1" hidden></select>
            </div>
            <button class="page-chat-compact-action is-disabled" type="button" disabled title="Nhập bằng giọng nói — sắp ra mắt" aria-label="Nhập bằng giọng nói, hiện chưa khả dụng"><i class="fa-solid fa-microphone"></i></button>
            <button id="page-chat-send-button" class="page-chat-send-button page-chat-send-icon-btn" type="button" onclick="handlePageChatSendAction()" aria-label="Gửi yêu cầu" title="Gửi yêu cầu"
              style="padding: 9px 20px; border-radius: 50% !important; font-weight: 700; font-size: 13px; background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%); color: #ffffff; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 3px 10px rgba(79, 70, 229, 0.25); transition: all 0.2s;">
              <i class="fa-solid fa-arrow-up"></i>
            </button>
          </div>
        </div>
      </div>

    </div>

  </div>
</div>
