<div class="system-tools-page" id="view-system-tools" data-display="grid" style="display: none;">
  <section class="system-tools-hero">
    <div class="system-tools-hero-icon"><i class="fa-solid fa-screwdriver-wrench"></i></div>
    <div>
      <span class="system-tools-eyebrow">INTELLIGENT CORE</span>
      <h2>Công cụ hệ thống</h2>
      <p>Danh mục Function Calling mà AI có thể sử dụng trong quá trình xử lý yêu cầu.</p>
    </div>
    <button class="btn-secondary-sm" type="button" onclick="fetchSystemTools(true)">
      <i class="fa-solid fa-rotate"></i> Tải lại
    </button>
  </section>

  <section class="system-tools-summary" aria-label="Thống kê công cụ">
    <div><span>Tổng số tool</span><strong id="system-tools-total">0</strong></div>
    <div><span>Đang khả dụng</span><strong class="available" id="system-tools-available">0</strong></div>
    <div><span>Nhóm chức năng</span><strong id="system-tools-groups">0</strong></div>
  </section>

  <section class="system-tools-card">
    <div class="system-tools-toolbar">
      <label class="system-tools-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="system-tools-search" type="search" placeholder="Tìm theo tên hoặc mô tả tool..." oninput="renderSystemTools()">
      </label>
      <div class="system-tools-filters" id="system-tools-filters"></div>
    </div>
    <div class="module-section-heading"><div><h3>Danh mục công cụ AI</h3><p>Xem chức năng và mở thông tin tham số của từng công cụ.</p></div></div>
    <div class="system-tools-grid" id="system-tools-grid">
      <div class="system-tools-loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải danh sách tool...</div>
    </div>
  </section>
</div>
