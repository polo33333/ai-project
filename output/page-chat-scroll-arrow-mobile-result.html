<!DOCTYPE html>
<html data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../src/frontend/css/chat-conversation.css">
<style>
body{margin:0;font:14px Arial}html[data-theme=dark] body{background:#151922;color:#eee}
#view-page_chat{height:700px;display:flex;flex-direction:column;--chat-content-width:880px;--chat-gutter:16px}
#page-chat-messages-container{flex:1;overflow-y:auto}#thread{height:1200px;flex:none}
#quick-prompts-bar{display:flex;gap:8px;padding-bottom:8px}textarea{width:100%}.page-chat-composer{background:inherit}
</style></head><body><main id="view-page_chat"><div id="page-chat-messages-container"><div id="thread">Conversation content<div>New streamed content</div></div></div>
<div class="page-chat-composer-area"><div id="quick-prompts-bar"><button>Suggested reply</button></div><button type="button" class="chat-scroll-activity has-scroll-arrow" title="AI đang trả lời · Về cuối hội thoại" aria-label="AI đang trả lời · Về cuối hội thoại" data-active="true" hidden=""><i class="fa-solid fa-arrow-down chat-scroll-arrow" aria-hidden="true"></i><span aria-hidden="true"><i></i><i></i><i></i></span></button><div class="page-chat-composer"><textarea id="page-chat-user-input" placeholder="Hỏi KAI..."></textarea></div></div></main><pre id="result">{"visibleWhileIdle":true,"oneControl":true,"combined":true,"noOverlap":true,"reachedBottom":true,"followsWhileAnswering":true}</pre>
<script src="../src/frontend/embed/chat-stream.js"></script><script src="../src/frontend/js/chat_reasoning_ui.js"></script><script>
(async()=>{
 document.documentElement.dataset.theme=location.search.includes('dark')?'dark':'light';
 const container=document.getElementById('page-chat-messages-container'),anchor=document.querySelector('.page-chat-composer');let active=false;
 const watch=()=>ChatReasoningUI.watchActivity(container,anchor,()=>active,{showWhenIdle:true,arrow:true});watch();
 const wait=()=>new Promise(resolve=>setTimeout(resolve,100));await wait();
 const button=document.querySelector('.chat-scroll-activity'),visibleWhileIdle=!button.hidden;
 active=true;watch();await wait();
 const oneControl=document.querySelectorAll('.chat-scroll-activity').length===1,combined=button.dataset.active==='true';
 const box=button.getBoundingClientRect(),composer=anchor.getBoundingClientRect(),prompts=document.getElementById('quick-prompts-bar').getBoundingClientRect();
 const noOverlap=box.bottom<=composer.top&&box.top>=prompts.bottom;
 button.click();await wait();const reachedBottom=container.scrollHeight-container.scrollTop-container.clientHeight<2;
 document.getElementById('thread').appendChild(Object.assign(document.createElement('div'),{textContent:'New streamed content'}));await wait();
 const followsWhileAnswering=container.scrollHeight-container.scrollTop-container.clientHeight<2;
 document.getElementById('result').textContent=JSON.stringify({visibleWhileIdle,oneControl,combined,noOverlap,reachedBottom,followsWhileAnswering});
})();
</script>
</body></html>
