<!DOCTYPE html>
<html data-theme="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="../src/frontend/css/theme.css"><link rel="stylesheet" href="../src/frontend/css/chat-conversation.css">
<style>body{font:14px Arial;background:#0e1624;padding:24px}#view-page_chat{width:300px}.chat-input-wrapper{padding:20px;border-radius:18px}.page-chat-model-menu.chat-effort-panel{display:block!important;position:static!important;margin:0!important}</style>
</head><body><div id="view-page_chat"><div class="chat-input-wrapper"><div class="page-chat-model-menu chat-effort-panel"><div class="chat-effort-heading"><div><strong>Suy luận</strong><small>qwen3.5:9b</small></div></div>
<div class="chat-effort-track"><input id="chat-effort-slider" type="range" min="0" max="1" value="1" style="--effort-progress: 100%;"><span class="chat-effort-stops"><i></i><i></i></span></div><div class="chat-effort-endpoints"><span>Nhanh</span><span>Suy luận</span></div></div></div></div><pre id="result">[{"theme":"dark","progress":"0%","gradient":true,"blue":true},{"theme":"dark","progress":"100%","gradient":true,"blue":true},{"theme":"light","progress":"0%","gradient":true,"blue":true},{"theme":"light","progress":"100%","gradient":true,"blue":true}]</pre>
<script>
const slider=document.getElementById('chat-effort-slider'),results=[];
for(const theme of ['dark','light']){document.documentElement.dataset.theme=theme;for(const progress of ['0%','100%']){slider.style.setProperty('--effort-progress',progress);const background=getComputedStyle(slider).backgroundImage;results.push({theme,progress,gradient:background.includes('linear-gradient'),blue:background.includes('82, 159, 255')});}}
document.documentElement.dataset.theme='dark';slider.style.setProperty('--effort-progress','100%');document.getElementById('result').textContent=JSON.stringify(results);
</script>
</body></html>
