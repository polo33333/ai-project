<!DOCTYPE html>
<html data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../src/frontend/css/workflow_plugins.css">
<style>body{margin:16px;background:#141922;color:#e2e8f0;font:14px Arial}#panel{max-width:700px;margin:auto}input{box-sizing:border-box;max-width:100%}#result{white-space:pre-wrap}</style>
</head><body><div id="panel"><div class="workflow-execution-panel" data-execution-key="8842ee58-609f-4558-8a7e-3bf47e54ff0c" data-automation-run="fixture" aria-busy="false" data-status="SUCCEEDED"><div class="wp-execution-header"><span class="wp-execution-icon"><i class="fa-solid fa-check" aria-hidden="true"></i></span><strong class="wp-execution-title">Workflow submission</strong><span class="wp-execution-status">Hoàn thành</span><button type="button" class="wp-execution-fold" aria-expanded="true" aria-label="Thu gọn nghiệp vụ" title="Thu gọn"><i class="fas fa-chevron-up" aria-hidden="true"></i></button></div></div></div><pre id="result">{"sameForm":true,"keptValue":true,"noWaitingScreen":true,"lockedWhileRunning":true,"posts":1,"finished":true}</pre>
<script src="../src/frontend/embed/chat-stream.js"></script>
<script>
const initial={id:'fixture',name:'Workflow submission',revision:1,status:'WAITING_INPUT',steps:[],result:null,missingInputs:[{key:'reference',label:'Reference',ask:'Reference',required:true,schema:{type:'string'}}]};
let posts=0;
window.fetch=async(url,options={})=>{
 if(options.method==='POST'){
  posts++;await new Promise(resolve=>setTimeout(resolve,40));
  if(location.search.includes('failure'))throw new TypeError('Connection unavailable');
  return {ok:true,json:async()=>({execution:{...initial,status:'READY',revision:2}})};
 }
 return {ok:true,json:async()=>({execution:{...initial,status:'SUCCEEDED',revision:3,missingInputs:[]}})};
};
</script><script src="../src/frontend/js/modules/workflow_plugins.js"></script><script>
(async()=>{
 const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms)),panel=document.getElementById('panel');
 panel.innerHTML=renderWorkflowExecution(initial);await wait(40);
 const node=panel.firstElementChild,form=node.querySelector('form'),input=form.querySelector('input'),submit=form.querySelector('button[type=submit]');input.value='Preserved input';
 form.dispatchEvent(new Event('submit',{cancelable:true}));form.dispatchEvent(new Event('submit',{cancelable:true}));await wait(120);
 const sameForm=node.querySelector('form')===form,keptValue=input.value==='Preserved input',noWaitingScreen=!node.querySelector('.wp-execution-loading');
 const lockedWhileRunning=input.disabled&&submit.disabled;
 if(location.search.includes('failure')){document.getElementById('result').textContent=JSON.stringify({sameForm,keptValue,noWaitingScreen,posts,recovered:!input.disabled&&!submit.disabled,inlineError:!!form.querySelector('.wp-execution-error').textContent});return;}
 await wait(1550);
 document.getElementById('result').textContent=JSON.stringify({sameForm,keptValue,noWaitingScreen,lockedWhileRunning,posts,finished:node.dataset.status==='SUCCEEDED'});
})();
</script>
</body></html>
