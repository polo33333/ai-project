<!doctype html><meta charset="utf-8"><title>Answer paint check</title>
<div id="host"></div><pre id="result">pending</pre>
<script src="../src/frontend/embed/chat-stream.js"></script>
<script>
(async()=>{
 const host=document.getElementById('host'),preview=ChatStream.createPreview(host);
 const text='A long provider response arriving in one network chunk. '.repeat(60),samples=[];
 const timer=setInterval(()=>samples.push(host.textContent.length),30);
 const start=new URLSearchParams(location.search).has('verified')?{id:'live',verified:true,animate:true}:{id:'live',verified:false};
 const wire='event: answer_start\ndata: '+JSON.stringify(start)+'\n\n'
  +'event: answer_delta\ndata: '+JSON.stringify({id:'live',seq:1,delta:text})+'\n\n'
  +'event: final\ndata: {"reply":"Done"}\n\n';
 let sent=false;
 await ChatStream.read({ok:true,headers:new Headers({'content-type':'text/event-stream'}),body:{getReader:()=>({
  async read(){if(sent)return {done:true};sent=true;return {value:new TextEncoder().encode(wire),done:false};},async cancel(){},releaseLock(){}
 })}},{onAnswer:event=>preview.update(event)});
 clearInterval(timer);
 document.getElementById('result').textContent=JSON.stringify({progressive:samples.some(n=>n>0&&n<text.length),complete:host.textContent===text,samples,hidden:document.hidden});
})();
</script>
